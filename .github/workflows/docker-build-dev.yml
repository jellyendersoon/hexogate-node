name: Build and Push Docker Image (Dev)

# Builds a branch image only from the dev branch or on demand, so ordinary
# feature-branch pushes do not spend Actions minutes on multi-arch builds.
on:
  push:
    branches:
      - dev
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  GHCR_IMAGE: ghcr.io/jellyendersoon/${{ github.event.repository.name }}:${{ github.ref_name }}
  XRAY_REPO: ${{ vars.XRAY_REPO || 'XTLS/Xray-core' }}
  XRAY_VERSION: ${{ vars.XRAY_VERSION || 'latest' }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Log in to the Container registry
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push multi-arch Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.GHCR_IMAGE }}
          build-args: |
            XRAY_REPO=${{ env.XRAY_REPO }}
            XRAY_VERSION=${{ env.XRAY_VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
