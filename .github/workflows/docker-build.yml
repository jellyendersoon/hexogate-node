name: Build and Push Docker Image (On Release)

on:
  release:
    types: [created]

env:
  REGISTRY: ghcr.io
  GHCR_IMAGE: ghcr.io/jellyendersoon/${{ github.event.repository.name }}:${{ github.ref_name }}
  GHCR_IMAGE_LATEST: ghcr.io/jellyendersoon/${{ github.event.repository.name }}:latest
  # Xray core to bundle. Set the repository variables XRAY_REPO / XRAY_VERSION to
  # ship your own Xray fork; they default to upstream XTLS/Xray-core, latest.
  XRAY_REPO: ${{ vars.XRAY_REPO || 'XTLS/Xray-core' }}
  XRAY_VERSION: ${{ vars.XRAY_VERSION || 'latest' }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Log in to the Container registry
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{env.GHCR_IMAGE}}

      - name: Set Docker tags
        id: tags
        run: |
          if [ "${{ github.event.release.prerelease }}" = "true" ]; then
            # Pre-release: only version tags
            echo "DOCKER_TAGS=${{env.GHCR_IMAGE}}" >> $GITHUB_ENV
          else
            # Regular release: version tags + latest tags
            echo "DOCKER_TAGS=${{env.GHCR_IMAGE}},${{env.GHCR_IMAGE_LATEST}}" >> $GITHUB_ENV
          fi

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.DOCKER_TAGS }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            XRAY_REPO=${{ env.XRAY_REPO }}
            XRAY_VERSION=${{ env.XRAY_VERSION }}
          cache-from: type=gha